name: 機能要望 (日本語)
description: 新しい挙動・拡張の提案
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。検討しやすいように以下を埋めてください。

        英語で提案する場合は別途 "Feature request" テンプレートも利用できます。

  - type: textarea
    id: problem
    attributes:
      label: ユースケース / 解決したい問題
      description: 何をやりたいか。今の挙動でどこに引っかかっているか。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する挙動
      description: プラグインに何をしてほしいか、なるべく具体的に — 環境変数、レスポンスの形、エラー処理など。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 他にどんなアプローチを考えたか、なぜそれを選ばなかったか。
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: その他
      description: 関連する Even App / Hermes / G2 の事情、参考になる Hermes plugin のリンクなど。
    validations:
      required: false
